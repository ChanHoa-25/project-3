<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang đăng ký (Ứng viên)</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="bg-[#000071] py-[15px]">
      <div class="container mx-auto px-[16px]">
        <!-- Wrap -->
        <div class="flex justify-between items-center">
          <!-- Logo -->
          <a href="#" class="text-[#fff] font-[800] sm:text-[28px] text-[20px] lg:flex-none flex-1"> 28.ITJobs </a>
          <!-- Menu -->
          <nav class="lg:block hidden">
            <ul class="flex gap-x-[30px]">
              <li class="inline-flex items-center gap-x-[8px] relative group/sub-1">
                <a href="#" class="text-[#fff] text-[16px] font-[800] group:hover"> Việc làm ITa</a>
                <i class="fa-solid fa-angle-down text-[#fff] text-[16px]"></i>
                <ul class="absolute top-[100%] left-[0] w-[280px] bg-[#000065] hidden group-hover/sub-1:block">
                  <li
                    class="py-[10px] px-[16px] rounded-[4px] flex items-center justify-between hover:bg-[#000096] relative group/sub-2">
                    <a href="" class="text-[#fff] text-[16px] font-[600]">Việc làm IT theo kỹ năng</a>
                    <i class="fa-solid fa-angle-right text-[#fff] text-[16px]"></i>
                    <ul class="absolute top-[0] left-[100%] w-[280px] bg-[#000065] hidden group-hover/sub-2:block">
                      <li
                        class="py-[10px] px-[16px] rounded-[4px] flex items-center justify-between hover:bg-[#000096]">
                        <a href="" class="text-[#fff] text-[16px] font-[600]">ReactJS</a>
                      </li>
                      <li
                        class="py-[10px] px-[16px] rounded-[4px] flex items-center justify-between hover:bg-[#000096]">
                        <a href="" class="text-[#fff] text-[16px] font-[600]">NodeJS</a>
                      </li>
                    </ul>
                  </li>
                  <li class="py-[10px] px-[16px] rounded-[4px] flex items-center justify-between hover:bg-[#000096]">
                    <a href="" class="text-[#fff] text-[16px] font-[600]">Việc làm IT theo công ty</a>
                    <i class="fa-solid fa-angle-right text-[#fff] text-[16px]"></i>
                  </li>
                  <li class="py-[10px] px-[16px] rounded-[4px] flex items-center justify-between hover:bg-[#000096]">
                    <a href="" class="text-[#fff] text-[16px] font-[600]">Việc làm IT theo thành phố</a>
                    <i class="fa-solid fa-angle-right text-[#fff] text-[16px]"></i>
                  </li>
                </ul>
              </li>
              <li class="">
                <a href="#" class="text-[#fff] text-[16px] font-[800]"> Top Công Ty IT</a>
                <i class="fa-solid fa-angle-down text-[#fff] text-[16px]"></i>
              </li>
              <li class="">
                <a href="#" class="text-[#fff] text-[16px] font-[800]"> Nhà Tuyển Dụng</a>
                <i class="fa-solid fa-angle-down text-[#fff] text-[16px]"></i>
              </li>
            </ul>
          </nav>
          <!-- Account -->
          <div class="inline-flex items-center gap-x-[5px] text-[#fff] font-[600] sm:text-[16px] text-[12px]">
            <a href="#" class="">Đăng nhập</a>
            <span class="">/</span>
            <a href="#" class="">Đăng ký</a>
          </div>
          <!-- Button Menu Mobile -->
          <button class="lg:hidden inline-block">
            <i class="fa-solid fa-bars text-[#fff] text-[20px] ml-[12px]"></i>
          </button>
        </div>
      </div>
    </header>
    <!-- End Header -->
    <!-- Form đăng ký (Nhà tuyển dụng) -->
    <div class="py-[60px]">
      <div class="container mx-auto px-[16px]">
        <div class="border border-[#DEDEDE] rounded-[8px] px-[20px] py-[50px] mt-[20px] max-w-[602px] mx-auto">
          <h1 class="font-[700] text-[20px] text-[#000] text-center mb-[20px]">Đăng ký (Ứng viên)</h1>
          <form action="" class="grid grid-cols-1 gap-y-[15px]">
            <div class="">
              <label for="fullName" class="block font-[500] text-[14px] text-[#000000] mb-[5px]"
                >Họ tên *</label
              >
              <input
                type="text"
                class="w-[100%] h-[46px] border border-[#DEDEDE] rounded-[4px] px-[20px] font-[500] text-[14px] text-[#000000]"
                placeholder="Le Van A" />
            </div>
            <div class="">
              <label for="email" class="block font-[500] text-[14px] text-[#000000] mb-[5px]">Email *</label>
              <input
                type="email"
                class="w-[100%] h-[46px] border border-[#DEDEDE] rounded-[4px] px-[20px] font-[500] text-[14px] text-[#000000]"
                placeholder="levana@gmail.com" />
            </div>
            <div class="">
              <label for="password" class="block font-[500] text-[14px] text-[#000000] mb-[5px]">Mật khẩu *</label>
              <input
                type="password"
                class="w-[100%] h-[46px] border border-[#DEDEDE] rounded-[4px] px-[20px] font-[500] text-[14px] text-[#000000]" />
            </div>
            <div class="">
             <button class="w-[100%] px-[20px] h-[48px] bg-[#0088FF] rounded-[4px] font-[700] text-[16px] text-[#fff]">Đăng ký</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="bg-[#000065] py-[24px]">
      <div class="container mx-auto px-[16px]">
        <div class="text-[#fff] font-[700] text-[28px] text-center mb-[10px]">28IT.Jobs</div>
        <div class="text-[12px] text-[#A6A6A6] font-[400] text-center">Copyright © IT VIEC JSC</div>
      </div>
    </footer>
    <!--Footer  -->
  </body>
</html>
